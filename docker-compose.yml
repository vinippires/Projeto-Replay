services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-replay}
      POSTGRES_USER: ${DB_USER:-replay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replay}
    ports:
      - "5432:5432"
    volumes:
      - replay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-replay} -d ${DB_NAME:-replay}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api-ktor
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-replay}
      DB_USER: ${DB_USER:-replay}
      DB_PASSWORD: ${DB_PASSWORD:-replay}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  replay_pgdata:
